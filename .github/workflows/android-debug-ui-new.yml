name: Android Debug Build (GitHub Only)

concurrency:
  group: android-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  # uncomment if you want auto build on push
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.4

      - name: Clean
        run: |
          rm -rf ~/.gradle
          rm -rf app/build
          rm -rf build

      - name: Build DEBUG APK
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
