name: Android Debug Build (CI Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CI sanity check (print files)
        run: |
          echo "PWD:"
          pwd
          echo "ROOT FILES:"
          ls -la
          echo "GRADLE DIR:"
          ls -la gradle || true
          echo "WRAPPER DIR:"
          ls -la gradle/wrapper || true
          echo "WRAPPER JAR INFO:"
          file gradle/wrapper/gradle-wrapper.jar || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build DEBUG APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache
